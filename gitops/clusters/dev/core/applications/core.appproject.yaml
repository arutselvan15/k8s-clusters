# Keep sourceRepos in sync with Application repoURLs in gitops/clusters/.
# Synced by core-apps (same directory as child Application manifests).

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform core components (ingress, certificates, shared infra)
  sourceRepos:
    - https://github.com/arutselvan15/k8s-platform.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno/
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
