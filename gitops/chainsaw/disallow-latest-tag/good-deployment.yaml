apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-pinned
  namespace: chainsaw-disallow-latest-tag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: good-pinned
  template:
    metadata:
      labels:
        app: good-pinned
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.3
