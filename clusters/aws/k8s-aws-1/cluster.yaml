# AWS lab cluster (committed). Directory name is the config id.
# Nodes: k8s-aws-1-cp, k8s-aws-1-wk-N. State: sensitive/aws/k8s-aws-1
#
#   ./scripts/infra/up.sh aws k8s-aws-1

cluster_name: k8s-aws

terraform:
  worker_nodes: 1
  node_instance_type: t3.medium
  vpc_cidr: 10.0.0.0/16
  # Tighten to YOUR.PUBLIC.IP/32 when you leave the lab default.
  admin_cidr: 0.0.0.0/0

kubeadm:
  kubernetes_version: "1.32"
  pod_cidr: 192.168.0.0/16
