# AWS lab cluster (committed). Directory name is the config id.
# Nodes: k8s-aws-cp, k8s-aws-wk-N. State: sensitive/aws/k8s-aws
#
#   ./scripts/infra/up.sh aws k8s-aws

cluster_name: k8s-aws

terraform:
  worker_nodes: 1
  node_instance_type: t3.medium
  vpc_cidr: 10.0.0.0/16
  # Public subnet = cidrsubnet(vpc_cidr, subnet_newbits, subnet_netnum).
  subnet_newbits: 8
  subnet_netnum: 1
  # Tighten to YOUR.PUBLIC.IP/32 when you leave the lab default.
  admin_cidr: 0.0.0.0/0
  root_volume_gb: 20
  root_volume_type: gp3
  ssh_user: ubuntu
  # Canonical Ubuntu 22.04 (Jammy) amd64. ami_owner is Canonical's public AWS account id.
  ami_name: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
  ami_owner: "099720109477"

kubeadm:
  kubernetes_version: "1.32"
  pod_cidr: 192.168.0.0/16

  # Pod network. Key reference: docs/infra/openstack.md, trade-offs:
  # docs/cilium.md. Both versions stay pinned and cilium_* is ignored under
  # calico, so flipping cni needs no other edit here.
  cni: calico
  calico_version: "3.29.3"
  cilium_version: "1.17.18"
  # Decided at kubeadm init (--skip-phases=addon/kube-proxy), so this one needs
  # kubeadm/reset.sh to change.
  cilium_kube_proxy_replacement: true
  cilium_tunnel_protocol: vxlan
  # false when worker_nodes is 0: relay and UI do not tolerate the CP taint.
  cilium_hubble: true
  cilium_operator_replicas: 1
