# S3 backup of sensitive/ (not a secret). Bucket names are globally unique.
# Do not put AWS keys here.
#
#   ./scripts/sensitive/s3.sh init
#   ./scripts/sensitive/s3.sh push --prune
# After ./scripts/infra/up.sh, ./scripts/infra/down.sh, or kubeadm/up.sh: y/N then push --prune.

bucket: arun-aws-s3-general
region: us-east-1
prefix: k8s-platform/sensitive
