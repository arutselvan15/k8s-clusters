# OpenStack lab cluster (committed). Directory name is the config id.
# Nodes: k8s-ocp-cp, k8s-ocp-wk-N. Auth: sensitive/openstack/clouds.yaml
#
#   ./scripts/infra/up.sh openstack k8s-ocp

cluster_name: k8s-ocp
# Must match a key under clouds: in sensitive/openstack/clouds.yaml
cloud: openstack

terraform:
  worker_nodes: 1
  ssh:
    user: ubuntu
    port: 22
    key_algorithm: ED25519
  kubernetes_api_port: 6443
  # Tighten to YOUR.PUBLIC.IP/32 when you leave the lab default.
  admin_cidr: 0.0.0.0/0
  root_volume_gb: 20
  volume_delete_on_termination: true
  availability_zone: "cloud-rtp-1-c"
  image:
    name: UBUNTU-24-SM-2026-05-V2
    most_recent: true
  node_flavor: 4vCPUx8GB
  network_name: tenant-internal-direct-net
  octavia:
    lb_flavor: Octavia_2vCPUx2GB
    lbs: []

kubeadm:
  kubernetes_version: "1.32"
  pod_cidr: 192.168.0.0/16

  # Pod network. Key reference: docs/infra/openstack.md, trade-offs:
  # docs/cilium.md. Both blocks stay pinned and kubeadm.cilium.* is ignored
  # under calico, so flipping cni needs no other edit here.
  cni: calico
  calico:
    version: "3.29.3"
  cilium:
    version: "1.17.18"
    # Decided at kubeadm init (--skip-phases=addon/kube-proxy), so this one
    # needs kubeadm/reset.sh to change.
    kube_proxy_replacement: true
    tunnel_protocol: vxlan
    # false when worker_nodes is 0: relay and UI do not tolerate the CP taint.
    hubble: true
    operator_replicas: 1
