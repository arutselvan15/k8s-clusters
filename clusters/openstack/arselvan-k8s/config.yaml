# OpenStack lab cluster (committed). Directory name is the config id.
# Nodes: k8s-ocp-cp, k8s-ocp-wk-N. Auth: sensitive/openstack/clouds.yaml
#
#   ./scripts/infra/up.sh openstack k8s-ocp

cluster_name: arselvan-k8s
# Must match a key under clouds: in sensitive/openstack/clouds.yaml
cloud: openstack

terraform:
  worker_nodes: 4
  ssh_user: ubuntu
  ssh_port: 22
  kubernetes_api_port: 6443
  # Tighten to YOUR.PUBLIC.IP/32 when you leave the lab default.
  admin_cidr: 0.0.0.0/0
  # Root disk is for the node OS/runtime only. Persistent model cache and app
  # data should live on Cinder CSI PVCs (see k8s-apps/common/helm/openstack-
  # cinder-csi.yaml), not on the VM root volume.
  root_volume_gb: 50
  volume_delete_on_termination: true
  image_most_recent: true
  ssh_key_algorithm: ED25519
  availability_zone: "cloud-rtp-1-c"
  image_name: UBUNTU-24-SM-2026-05-V2
  node_flavor: 4vCPUx8GB
  network_name: tenant-internal-direct-net
  # Required for Octavia: this network has several subnets.
  subnet_name: tenant-internal-direct-subnet7
  # Octavia: each list item is one VIP (listeners stay 80/443) and uses 1 quota.
  # NodePorts must be in 30000-32767. Convention here: service port + 30000
  # (80→30080, 443→30443). Extra LBs pick unused ports in the same range.
  # Keep these in sync with k8s-apps overlays/cluster/arselvan-k8s/*.yaml.
  octavia_lb_flavor: Octavia_2vCPUx2GB
  octavia_lbs: []

kubeadm:
  kubernetes_version: "1.32"
  pod_cidr: 192.168.0.0/16

  # Pod network. Key reference: docs/infra/openstack.md, trade-offs:
  # docs/cilium.md. Both versions stay pinned and cilium_* is ignored under
  # calico, so flipping cni needs no other edit here.
  cni: calico
  calico_version: "3.29.3"
  cilium_version: "1.17.18"
  # Decided at kubeadm init (--skip-phases=addon/kube-proxy), so this one needs
  # kubeadm/reset.sh to change — same as cloud_provider below.
  cilium_kube_proxy_replacement: true
  cilium_tunnel_protocol: vxlan
  # false when worker_nodes is 0: relay and UI do not tolerate the CP taint.
  cilium_hubble: true
  cilium_operator_replicas: 1

  # external = kubelet runs --cloud-provider=external and OCCM owns the Octavia
  # LBs, so keep octavia_lbs empty. Unset or "" = kubelet manages nothing and
  # LBs come from octavia_lbs above. See docs/infra/openstack.md.
  cloud_provider: external
  occm_chart_version: "2.32.0"
